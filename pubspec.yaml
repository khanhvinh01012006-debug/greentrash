# ============================================================================
# pubspec.yaml - File khai báo thông tin project và các thư viện (package)
# Sau khi tạo project bằng `flutter create`, hãy thay phần dependencies
# bằng nội dung dưới đây, rồi chạy: flutter pub get
# ============================================================================
name: greentrash
description: "GreenTrash - Dat lich thu gom rac tai nha (Nhom 30)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Thư viện chính kết nối Supabase: đăng nhập, database, storage, realtime
  supabase_flutter: ^2.8.0

  # Chọn ảnh từ máy tính / điện thoại để upload
  image_picker: ^1.1.2

  # Định dạng ngày tháng và số tiền kiểu Việt Nam (vd: 15.000 đ)
  intl: ^0.19.0

  # Lưu dữ liệu nhỏ trên máy người dùng (ghi nhớ email đăng nhập)
  shared_preferences: ^2.3.0

  cupertino_icons: ^1.0.8

  # Cho phép đường dẫn web sạch (vd: /admin) thay vì có dấu # (vd: /#/admin)
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Khai báo thư mục chứa ảnh đóng gói kèm app (mã QR thanh toán)
  # Ảnh trong này gọi bằng Image.asset('assets/ten_file.png')
  # LƯU Ý: Flutter không tự quét thư mục con - khai báo "assets/" chỉ lấy
  # file nằm TRỰC TIẾP trong đó, nên assets/images/ (ảnh banner) phải khai
  # báo thêm 1 dòng riêng bên dưới.
  assets:
    - assets/
    - assets/images/
